name: Fly Deploy (legacy)

# This is what deploys production.
#
# `legacy/` is the legislative management system running on beg-docket-manager:
# the docket, calendar, meetings, votes, minutes, municipal code, budget and
# procurement. `legacy/fly.toml` names that app and mounts the docket_data
# volume at /data, where the SQLite database lives.
#
# It used to be a rollback lever, from when the rebuild deployed over the same
# app. It is not that any more — the rebuild's fly.toml now names its own app,
# so this workflow is the only thing in the repository that reaches production.
# Run it to ship a change to the Board's live system, not to undo one.
#
# Deliberately workflow_dispatch: a push-triggered deploy of the Board's system
# is not something to acquire by accident.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Module load smoke test
        run: >
          node --experimental-sqlite --no-warnings -e
          "require('./src/repo');require('./src/views/pages');require('./src/views/admin');require('./src/views/org');require('./src/views/minutes');console.log('modules OK')"

  deploy:
    needs: smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy legacy to Fly
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
