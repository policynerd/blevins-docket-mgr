name: Fly Deploy

# Deploys the rebuild to beg-docket-manager, replacing the legacy application.
#
# Manual on purpose. This workflow used to run on every push to main, which was
# safe while it shipped `legacy/` — a build that had been serving traffic for
# months. It now replaces production with a stack that has never handled a real
# request, and "merged a pull request" is not the same intent as "cut production
# over". Restore the `push:` trigger once it has proven itself:
#
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:
#
# To go back to the legacy application, run the "Fly Deploy (legacy)" workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Fails the run before anything is built if the two secrets that cannot
      # live in fly.toml are missing. Without this the deploy succeeds, the
      # release command runs, and the machine then crashloops on a startup
      # error that reads as a code fault rather than a missing secret.
      - name: Check required secrets are set on the app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          names=$(flyctl secrets list --app beg-docket-manager --json | jq -r '.[].Name')
          missing=0
          for required in SESSION_SECRET ENTRA_TENANT_ID ENTRA_CLIENT_ID ENTRA_CLIENT_SECRET APP_BASE_URL DATABASE_URL; do
            if ! grep -qx "$required" <<< "$names"; then
              echo "::error::$required is not set on beg-docket-manager"
              missing=1
            fi
          done
          exit "$missing"

      - name: Deploy to Fly
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
