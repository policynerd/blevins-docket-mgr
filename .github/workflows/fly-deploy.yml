name: Fly Deploy

# Deploys the drafting application to its own Fly app, alongside the existing
# legislative management system rather than over it.
#
# Manual on purpose: this has never handled a real request. Restore the `push:`
# trigger once it has proven itself:
#
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Fails the run before anything is built if the two secrets that cannot
      # live in fly.toml are missing. Without this the deploy succeeds, the
      # release command runs, and the machine then crashloops on a startup
      # error that reads as a code fault rather than a missing secret.
      - name: Check required secrets are set on the app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          names=$(flyctl secrets list --app beg-docket-manager --json | jq -r '.[].Name')
          missing=0
          for required in SESSION_SECRET ENTRA_TENANT_ID ENTRA_CLIENT_ID ENTRA_CLIENT_SECRET APP_BASE_URL DATABASE_URL; do
            if ! grep -qx "$required" <<< "$names"; then
              echo "::error::$required is not set on beg-docket-manager"
              missing=1
            fi
          done
          exit "$missing"

      - name: Deploy to Fly
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
