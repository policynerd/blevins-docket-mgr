# Fly.io config — runs the Docker image with a persistent volume for SQLite.
# First-time setup:
#   fly volumes create docket_data --size 1 --region iad
#   fly deploy
# If a region reports "insufficient CPUs available", switch to another
# (e.g. ord, ewr, den, sjc, lax) in both the volume and primary_region.
app = 'beg-docket-manager'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  DOCKET_DB = '/data/docket.db'
  PORT = '3000'
  # The Board's seal, served from public/brand/. Two inks of one drawing: the
  # navy for light grounds, the reversed white for the navy sidebar. Set here
  # rather than left to the Branding screen so a rebuilt machine comes up with
  # the seal already on it. A value saved under Admin -> Branding still wins.
  ORG_LOGO_URL = '/brand/seal.png'
  ORG_LOGO_LIGHT_URL = '/brand/seal-light.png'

[[mounts]]
  source = 'docket_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  # 1gb, because a render was measured and 512mb was not enough.
  #
  # The first estimate here said "roughly 150-250mb" and set 512mb. That was a
  # guess, and it was wrong. Measured with smaps_rollup Pss — which apportions
  # the memory Chromium's processes share, rather than summing their RSS and
  # double-counting it — one render of a single Letter page costs:
  #
  #     chromium   284 MB
  #     node        64 MB
  #     ----------------
  #     total     ~350 MB
  #
  # against a limit that also has to hold the SQLite page cache, the HTTP
  # buffers and every other request in flight. ~160mb of headroom for all of
  # that, on the machine that prints the packet the morning of a meeting.
  #
  # Flag tuning does not rescue it: --single-process measured 248 MB and
  # --renderer-process-limit=1 measured 274 MB, so the most that is available
  # is about 36 MB, and --single-process buys it in Chromium's least
  # well-tested mode. Not worth it.
  #
  # This raises the cost of the machine, and that is the price of printing
  # through a browser. The alternative is honest and supported: go back to
  # 256mb and set DOCKET_RENDER=off, so the drawn documents are a choice rather
  # than something discovered by reading a PDF's Producer string.
  memory = '1gb'
