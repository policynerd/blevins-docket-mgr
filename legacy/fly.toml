# Fly.io config — runs the Docker image with a persistent volume for SQLite.
# First-time setup:
#   fly volumes create docket_data --size 1 --region iad
#   fly deploy
app = 'beg-docket-manager'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  DOCKET_DB = '/data/docket.db'
  PORT = '3000'
  ORG_LOGO_URL = '/brand/seal.png'
  ORG_LOGO_LIGHT_URL = '/brand/seal-light.png'
  DRAFTING_APP_URL = 'https://blevins-drafting.fly.dev'

[[mounts]]
  source = 'docket_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
