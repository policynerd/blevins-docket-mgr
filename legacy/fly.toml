# Fly.io config — runs the Docker image with a persistent volume for SQLite.
# First-time setup:
#   fly volumes create docket_data --size 1 --region iad
#   fly deploy
# If a region reports "insufficient CPUs available", switch to another
# (e.g. ord, ewr, den, sjc, lax) in both the volume and primary_region.
app = 'beg-docket-manager'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  DOCKET_DB = '/data/docket.db'
  PORT = '3000'
  # The Board's seal, served from public/brand/. Two inks of one drawing: the
  # navy for light grounds, the reversed white for the navy sidebar. Set here
  # rather than left to the Branding screen so a rebuilt machine comes up with
  # the seal already on it. A value saved under Admin -> Branding still wins.
  ORG_LOGO_URL = '/brand/seal.png'
  ORG_LOGO_LIGHT_URL = '/brand/seal-light.png'

[[mounts]]
  source = 'docket_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  # 512mb, not 256mb, because the documents are printed by a real browser.
  #
  # Chromium needs roughly 150-250mb to lay out and print a page, on top of
  # Node and the SQLite page cache. At 256mb it does not fail loudly — it is
  # killed by the OOM reaper, src/render.js falls back to the drawn pdf-lib
  # documents, and the packet comes out looking exactly as it did before while
  # nothing in the logs says why.
  #
  # This raises the cost of the machine. It is the price of the decision to
  # print through a browser; dropping back to 256mb is fine, but then set
  # DOCKET_RENDER=off so the fallback is a choice rather than a silent
  # discovery on a meeting morning.
  memory = '512mb'
